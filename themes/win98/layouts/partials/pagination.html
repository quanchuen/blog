{{ $paginator := .Paginator }}
{{ if gt $paginator.TotalPages 1 }}
<nav class="pagination" aria-label="Pagination">
  {{ if $paginator.HasPrev }}
  <a class="btn" href="{{ $paginator.Prev.URL }}">&lt; Back</a>
  {{ end }}
  {{ range $paginator.Pagers }}
  {{ if eq . $paginator }}
  <span class="btn active" aria-current="page">{{ .PageNumber }}</span>
  {{ else }}
  <a class="btn" href="{{ .URL }}">{{ .PageNumber }}</a>
  {{ end }}
  {{ end }}
  {{ if $paginator.HasNext }}
  <a class="btn" href="{{ $paginator.Next.URL }}">Next &gt;</a>
  {{ end }}
</nav>
{{ end }}
