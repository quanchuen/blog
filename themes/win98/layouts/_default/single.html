{{ define "main" }}
<article class="document">
  <header class="post-header">
    <h1>{{ .Title }}</h1>
    <div class="meta">
      {{ .Date.Format "2006-01-02" }}
      {{ if ne (.Lastmod.Format "2006-01-02") (.Date.Format "2006-01-02") }}
        · Updated {{ .Lastmod.Format "2006-01-02" }}
      {{ end }}
    </div>
    {{ partial "tag-pills.html" . }}
  </header>
  <div class="prose">
    {{ .Content }}
  </div>
</article>
{{ end }}
